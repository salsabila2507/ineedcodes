name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install
        run: npm install --no-audit --no-fund
      - name: syntax
        run: node --check src/cli.js
      - name: test
        run: npm test
      - name: real terminal test (pty)
        if: runner.os != 'Windows'
        run: script -qec "node src/cli.js --version" /dev/null
